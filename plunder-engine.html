<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>掠夺引擎 · 交互模块（调试）</title>
<style>
:root {
  --font-serif: 'Playfair Display', 'Noto Serif SC', Georgia, serif;
  --font-sans: 'DM Sans', 'Noto Sans SC', -apple-system, sans-serif;
  --surface-base: #F5F3EF;
  --surface-card: #FFFDF9;
  --surface-deep: #EDE8E0;
  --text-primary: #1A1612;
  --text-secondary: #5C534A;
  --text-tertiary: #8E857D;
  --border-light: #DDD6CC;
  --border-mid: #C9C0B4;
  --shadow-md: 0 4px 14px rgba(26,22,18,.08);
  --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
  --c-trump: #C4653A;
  --c-enemy: #A63D2E;
  --c-loyal: #4A4290;
  --c-war: #1A7A5E;
  --c-tech: #9A6B28;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--surface-base); font-family: var(--font-sans); color: var(--text-primary); padding: 24px 16px; }
body.test { display: none; }

/* ===== 掠夺引擎模块 ===== */
.pe-module {
  background: var(--surface-card);
  border: 1px solid var(--border-light);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 1px 3px rgba(0,0,0,.03);
  max-width: 1060px;
  margin: 0 auto;
}
.pe-topbar { display: flex; height: 4px; }
.pe-topbar i { flex: 1; }
.pe-head { padding: 20px 26px 12px; }
.pe-kicker { font-size: 12px; font-weight: 700; letter-spacing: .16em; color: var(--text-tertiary); text-transform: uppercase; }
.pe-title { font-family: var(--font-serif); font-size: clamp(20px, 2.4vw, 26px); font-weight: 900; margin-top: 6px; color: var(--text-primary); letter-spacing: -0.01em; }
.pe-title .en { font-size: .72em; color: var(--text-tertiary); font-style: italic; font-weight: 600; margin-left: 6px; letter-spacing: 0; }
.pe-sub { font-size: 13px; color: var(--text-secondary); margin-top: 7px; line-height: 1.7; max-width: 660px; }

/* 图例 + 筛选 */
.pe-bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 26px; border-top: 1px solid var(--border-light); border-bottom: 1px solid var(--border-light); background: var(--surface-base); }
.pe-legend { display: flex; gap: 12px; flex-wrap: wrap; }
.pe-lg { display: flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); cursor: pointer; user-select: none; }
.pe-lg i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.pe-filters { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.pe-fbtn {
  font-family: inherit; font-size: 12.5px; font-weight: 600;
  padding: 5px 13px; border-radius: 15px;
  border: 1.5px solid var(--border-light); background: var(--surface-card);
  color: var(--text-secondary); cursor: pointer;
  transition: all .2s var(--ease-out-quart);
}
.pe-fbtn:hover { border-color: var(--c-loyal); color: var(--c-loyal-dark); transform: translateY(-1px); }
.pe-fbtn.on { background: var(--text-primary); border-color: var(--text-primary); color: var(--surface-card); }
.pe-fbtn[data-thread="military"].on { background: #A63D2E; border-color: #A63D2E; }
.pe-fbtn[data-thread="reputation"].on { background: #9A6B28; border-color: #9A6B28; }
.pe-fbtn[data-thread="finance"].on { background: #1A7A5E; border-color: #1A7A5E; }
.pe-fbtn[data-thread="power"].on { background: #4A4290; border-color: #4A4290; }

/* 画布 */
.pe-canvas { position: relative; padding: 6px 26px 4px; }
.pe-marks { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: var(--text-tertiary); letter-spacing: .03em; padding-left: 96px; margin-bottom: 2px; }
.pe-marks .yr { color: var(--text-tertiary); opacity: .75; font-weight: 600; }
.pe-lanes { position: relative; }
.pe-lane { display: flex; align-items: center; height: 56px; }
.pe-lane-label {
  width: 92px; flex-shrink: 0;
  font-size: 13px; font-weight: 800; letter-spacing: .04em;
  text-align: right; padding-right: 12px;
}
.pe-lane-track {
  flex: 1; position: relative; height: 38px;
  border-radius: 8px;
  transition: opacity .3s;
}
.pe-lane.dim { opacity: .14; }
.pe-grid { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(26,22,18,.05); }
.pe-node {
  position: absolute; top: 50%; transform: translate(-50%, -50%);
  border-radius: 50%;
  background: var(--surface-card);
  border: 2.5px solid;
  cursor: pointer;
  transition: all .22s var(--ease-out-quart);
  z-index: 2;
}
.pe-node:hover { transform: translate(-50%, -50%) scale(1.18); box-shadow: var(--shadow-md); z-index: 5; }
.pe-node.on { background: var(--node-color, #A63D2E); border-color: var(--node-color, #A63D2E); box-shadow: 0 0 0 4px rgba(166,61,46,.18); }
.pe-tip {
  position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
  white-space: nowrap;
  font-size: 12px; font-weight: 700;
  background: var(--text-primary); color: var(--surface-card);
  padding: 4px 10px; border-radius: 7px;
  opacity: 0; pointer-events: none;
  transition: opacity .18s;
  z-index: 20;
  letter-spacing: .01em;
}
.pe-tip::after { content: ''; position: absolute; top: 100%; left: 50%; margin-left: -4px; border: 4px solid transparent; border-top-color: var(--text-primary); }
.pe-node:hover .pe-tip { opacity: 1; }
.pe-node.on .pe-tip { opacity: 1; }

/* 赌注刻度 */
.pe-stakes { position: absolute; right: 26px; top: 6px; bottom: 6px; width: 44px; border-left: 1px solid var(--border-light); display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 2px 0 2px 8px; }
.pe-stake-lbl { font-size: 10.5px; font-weight: 800; color: var(--text-tertiary); }
.pe-stake-lbl b { display: block; text-align: center; font-family: var(--font-serif); font-size: 15px; color: var(--text-secondary); }

/* 决策解剖面板 */
.pe-panel {
  margin: 8px 26px 6px;
  border: 1px solid var(--border-mid);
  border-left: 4px solid var(--c-enemy);
  border-radius: 0 12px 12px 0;
  background: var(--surface-base);
  padding: 14px 18px 16px;
  transition: border-color .3s;
}
.pe-panel-idle { font-size: 13px; color: var(--text-tertiary); line-height: 1.7; text-align: center; padding: 6px 0; }
.pe-panel-idle b { color: var(--text-secondary); }
.pe-ph { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.pe-p-tag { font-size: 11px; font-weight: 800; letter-spacing: .06em; padding: 3px 10px; border-radius: 10px; color: #fff; text-transform: uppercase; }
.pe-p-date { font-size: 12.5px; font-weight: 800; color: var(--text-tertiary); letter-spacing: .02em; }
.pe-p-title { font-size: 15.5px; font-weight: 800; color: var(--text-primary); line-height: 1.4; flex: 1; min-width: 200px; }
.pe-p-chap { font-size: 11.5px; color: var(--text-tertiary); font-weight: 600; white-space: nowrap; }
.pe-pf { display: grid; grid-template-columns: 84px 1fr; gap: 4px 12px; font-size: 13px; line-height: 1.65; color: var(--text-secondary); padding: 6px 0; border-top: 1px dashed var(--border-light); align-items: start; }
.pe-pf:first-of-type { border-top: none; }
.pe-pf-lbl { font-size: 11.5px; font-weight: 800; color: var(--text-tertiary); padding-top: 2px; letter-spacing: .04em; }
.pe-pf-val { color: var(--text-primary); }
.pe-warn {
  display: inline-block;
  margin-top: 3px;
  font-size: 11.5px; font-weight: 800;
  color: #791F1F; background: #FCEBEB;
  border: 1px solid rgba(121,31,31,.28);
  border-radius: 9px; padding: 3px 10px;
  letter-spacing: .02em;
}
.pe-outcome { margin-top: 8px; padding: 9px 12px; background: var(--surface-card); border: 1px solid var(--border-light); border-radius: 9px; font-size: 12.5px; color: var(--text-secondary); line-height: 1.65; }
.pe-outcome b { color: var(--text-primary); }

/* 杀手时刻字幕 */
.pe-tickers { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 26px 10px; }
.pe-ticker {
  display: inline-flex; align-items: center; gap: 7px;
  background: #2A1E13; color: #EEDFC7;
  border-radius: 9px; padding: 6px 12px;
  font-size: 12px; font-weight: 700; letter-spacing: .02em;
  opacity: .85; transition: all .3s;
}
.pe-ticker.hit { opacity: 1; box-shadow: 0 0 0 2px #D8B48C; }
.pe-ticker i { width: 7px; height: 7px; border-radius: 50%; background: #D8B48C; flex-shrink: 0; }
.pe-play {
  margin-left: auto;
  font-family: inherit; font-size: 12px; font-weight: 700;
  padding: 6px 14px; border-radius: 15px;
  border: 1.5px solid #2A1E13; background: transparent; color: #2A1E13;
  cursor: pointer; transition: all .2s var(--ease-out-quart);
}
.pe-play:hover { background: #2A1E13; color: #EEDFC7; }
.pe-note { padding: 0 26px 16px; font-size: 11.5px; color: var(--text-tertiary); line-height: 1.6; }

/* 节点闪烁动画（回放） */
@keyframes peFlash { 0% { box-shadow: 0 0 0 0 rgba(166,61,46,0); } 30% { box-shadow: 0 0 0 7px rgba(166,61,46,.35); } 100% { box-shadow: 0 0 0 0 rgba(166,61,46,0); } }
.pe-node.flash { animation: peFlash .9s ease-out; }

/* 移动端纵向降级 — 桌面隐藏，窄屏显示 */
.pe-mobile { display: none; }
.pe-mob-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; margin: 5px 0;
  background: var(--surface-card);
  border: 1px solid var(--border-light);
  border-left: 3px solid;
  border-radius: 0 9px 9px 0;
  cursor: pointer;
  transition: all .18s var(--ease-out-quart);
  font-size: 13px; color: var(--text-primary);
}
.pe-mob-item:hover { transform: translateX(2px); box-shadow: var(--shadow-md); }
.pe-mob-item .d { font-size: 11px; font-weight: 800; color: var(--text-tertiary); flex-shrink: 0; width: 58px; }
.pe-mob-item .t { font-weight: 700; line-height: 1.4; }
.pe-mob-item.on { box-shadow: inset 0 0 0 1.5px var(--node-color, #A63D2E); }

@media (max-width: 720px) {
  .pe-head { padding: 16px 16px 10px; }
  .pe-bar { padding: 10px 16px; }
  .pe-filters { margin-left: 0; width: 100%; }
  .pe-canvas { padding: 4px 16px 2px; }
  .pe-marks { padding-left: 0; }
  .pe-lane { display: none; }
  .pe-stakes { display: none; }
  .pe-mobile { display: block; }
  .pe-panel { margin: 8px 16px 6px; padding: 12px 14px 14px; }
  .pe-tickers { padding: 4px 16px 10px; }
  .pe-note { padding: 0 16px 14px; }
  .pe-pf { grid-template-columns: 70px 1fr; }
}
</style>
</head>

/* ===== 渲染 ===== */
const T0 = new Date('2025-08-01').getTime();
const T1 = new Date('2026-03-31').getTime();
const SIZE = {1: 12, 2: 15, 3: 18, 4: 21, 5: 24};
const pct = d => Math.min(100, Math.max(0, (new Date(d).getTime() - T0) / (T1 - T0) * 100));

let activeId = null;

function buildLanes() {
  const lanes = document.getElementById('peLanes');
  lanes.innerHTML = '';
  PE_ORDER.forEach((th, li) => {
    const t = PE_THREADS[th];
    const lane = document.createElement('div');
    lane.className = 'pe-lane';
    lane.dataset.thread = th;
    const lbl = document.createElement('div');
    lbl.className = 'pe-lane-label';
    lbl.style.color = t.color;
    lbl.textContent = t.cn;
    const track = document.createElement('div');
    track.className = 'pe-lane-track';
    track.style.background = hexA(t.color, .06);
    track.dataset.thread = th;
    // 月份网格线
    for (let m = 0; m <= 8; m++) {
      const g = document.createElement('div');
      g.className = 'pe-grid';
      g.style.left = (m / 8 * 100) + '%';
      track.appendChild(g);
    }
    // 节点
    PE_EVENTS.filter(e => e.thread === th).forEach(e => {
      const n = document.createElement('div');
      n.className = 'pe-node';
      n.dataset.id = e.id;
      n.style.left = pct(e.date) + '%';
      const s = SIZE[e.stakes] || 18;
      n.style.width = s + 'px';
      n.style.height = s + 'px';
      n.style.borderColor = t.color;
      n.style.setProperty('--node-color', t.color);
      n.title = e.title;
      const tip = document.createElement('div');
      tip.className = 'pe-tip';
      tip.innerHTML = e.date.slice(5).replace('-', '.') + ' · ' + e.title;
      n.appendChild(tip);
      n.addEventListener('click', () => selectEvent(e.id));
      track.appendChild(n);
    });
    lane.appendChild(lbl);
    lane.appendChild(track);
    lanes.appendChild(lane);
  });
}

function hexA(hex, a) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

/* ===== 移动端列表 ===== */
function buildMobile() {
  const box = document.getElementById('peMobile');
  box.innerHTML = '';
  PE_EVENTS.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(e => {
    const t = PE_THREADS[e.thread];
    const it = document.createElement('div');
    it.className = 'pe-mob-item' + (e.id === activeId ? ' on' : '');
    it.style.borderLeftColor = t.color;
    it.style.setProperty('--node-color', t.color);
    it.innerHTML = '<span class="d">' + e.date.slice(5).replace('-', '.') + '</span><span class="t">' + e.title + '</span>';
    it.addEventListener('click', () => selectEvent(e.id));
    box.appendChild(it);
  });
}

/* ===== 决策解剖面板 ===== */
function selectEvent(id) {
  activeId = id;
  const e = PE_EVENTS.find(x => x.id === id);
  if (!e) return;
  const t = PE_THREADS[e.thread];
  document.querySelectorAll('.pe-node').forEach(n => n.classList.toggle('on', n.dataset.id === id));
  document.querySelectorAll('.pe-mob-item').forEach(n => n.classList.toggle('on', n.dataset.id === id));
  const p = document.getElementById('pePanel');
  p.style.borderLeftColor = t.color;
  p.innerHTML =
    '<div class="pe-ph">' +
      '<span class="pe-p-tag" style="background:' + t.color + '">' + t.cn + '</span>' +
      '<span class="pe-p-date">' + e.date + ' · 赌注 ' + e.stakes + '/5</span>' +
      '<span class="pe-p-title">' + e.title + '</span>' +
      '<span class="pe-p-chap">' + e.chapter + '</span>' +
    '</div>' +
    '<div class="pe-pf"><span class="pe-pf-lbl">① 触发</span><span class="pe-pf-val">' + e.trigger + '</span></div>' +
    '<div class="pe-pf"><span class="pe-pf-lbl">② 法律重新定义</span><span class="pe-pf-val">' + e.legal_redefinition + '</span></div>' +
    '<div class="pe-pf"><span class="pe-pf-lbl">③ 谁在场</span><span class="pe-pf-val">' + e.in_room + '</span></div>' +
    '<div class="pe-pf"><span class="pe-pf-lbl">④ 谁被排除</span><span class="pe-pf-val">' + e.excluded + '</span></div>' +
    '<div class="pe-pf"><span class="pe-pf-lbl">⑤ 被无视的警告</span><span class="pe-pf-val">' + e.warning_ignored + '<br><span class="pe-warn">⚠ 警告被无视</span></span></div>' +
    '<div class="pe-outcome"><b>后果 ·</b> ' + e.outcome + '</div>';
}

/* ===== 筛选 ===== */
let curThread = 'all';
document.querySelectorAll('.pe-fbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    curThread = btn.dataset.thread;
    document.querySelectorAll('.pe-fbtn').forEach(b => b.classList.toggle('on', b === btn));
    document.querySelectorAll('.pe-lane').forEach(lane => {
      lane.classList.toggle('dim', curThread !== 'all' && lane.dataset.thread !== curThread);
    });
  });
});
document.querySelectorAll('.pe-lg').forEach(lg => {
  lg.addEventListener('click', () => {
    const th = lg.dataset.thread;
    const btn = document.querySelector('.pe-fbtn[data-thread="' + th + '"]');
    if (btn) btn.click();
  });
});

/* ===== 杀手时刻：节奏回放 ===== */
const playBtn = document.getElementById('pePlay');
let playing = false;
playBtn.addEventListener('click', () => {
  if (playing) return;
  playing = true;
  playBtn.textContent = '⏸ 回放中…';
  const nodes = PE_EVENTS.slice().sort((a, b) => a.date.localeCompare(b.date));
  const tk1 = document.getElementById('tk1'), tk2 = document.getElementById('tk2');
  tk1.classList.remove('hit'); tk2.classList.remove('hit');
  let i = 0;
  function step() {
    if (i >= nodes.length) {
      playing = false;
      playBtn.textContent = '▶ 播放节奏';
      setTimeout(() => { tk1.classList.remove('hit'); tk2.classList.remove('hit'); }, 1600);
      return;
    }
    const e = nodes[i];
    const el = document.querySelector('.pe-node[data-id="' + e.id + '"]');
    if (el) {
      el.classList.remove('flash');
      void el.offsetWidth;
      el.classList.add('flash');
      if (e.date <= '2025-09-30') tk1.classList.add('hit');
      if (e.date <= '2025-10-31') tk2.classList.add('hit');
    }
    i++;
    setTimeout(step, 620);
  }
  step();
});

/* ===== 初始化 ===== */
buildLanes();
buildMobile();
selectEvent('e4');
</script>
